<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .logo-brand { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <g id="emblem" transform="translate(15, 0)">
    <!-- Bottom Stem Notch -->
    <path 
      d="M 124 228 L 148 266 L 172 228" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="9.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Left Leaf -->
    <path 
      d="M 144 242 C 78 244 32 195 34 135 C 36 92 68 85 82 86 C 114 88 135 152 144 242 Z" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="9.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Left Leaf Vein -->
    <path 
      d="M 64 104 L 142 228" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="8.5" 
      stroke-linecap="round"
    />

    <!-- Right Leaf -->
    <path 
      d="M 152 242 C 218 244 264 195 262 135 C 260 92 228 85 214 86 C 182 88 161 152 152 242 Z" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="9.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Right Leaf Vein -->
    <path 
      d="M 232 104 L 154 228" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="8.5" 
      stroke-linecap="round"
    />

    <!-- Center Upright Leaf -->
    <path 
      d="M 148 38 C 96 95 86 172 148 245 C 210 172 200 95 148 38 Z" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="9.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Center Vein -->
    <path 
      d="M 148 88 L 148 242" 
      fill="none" 
      stroke="#0c3a2d" 
      stroke-width="8.5" 
      stroke-linecap="round"
    />
  </g>

  <!-- Typography matching IMG_4645.jpeg -->
  <g class="logo-brand" fill="#0c3a2d">
    <!-- ABT -->
    <text x="310" y="102" font-size="98" font-weight="800" letter-spacing="-0.02em">ABT</text>
    
    <!-- Environmental -->
    <text x="310" y="196" font-size="78" font-weight="700" letter-spacing="-0.02em">Environmental</text>
    
    <!-- ASBESTOS | LEAD | MOULD -->
    <text x="312" y="260" font-size="29" font-weight="700" letter-spacing="0.22em">ASBESTOS &nbsp;|&nbsp; LEAD &nbsp;|&nbsp; MOULD</text>
  </g>
</svg>
